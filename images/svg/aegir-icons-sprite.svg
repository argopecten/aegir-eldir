<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Aegir status icon sprite (symbol-based).
    Usage: <svg class="hosting-icon"><use href="path/aegir-icons-sprite.svg#icon-ok"></use></svg>
    Icons are 16x16 viewBox, colored via fill="currentColor" on the outer shape
    and white inner detail.
  -->

  <!-- OK / Success: green circle with white checkmark -->
  <symbol id="icon-ok" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="7.5" fill="#72f64a"/>
    <path d="M5 8.5 L7 10.5 L11 5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Error: red circle with white X -->
  <symbol id="icon-error" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="7.5" fill="#f5420b"/>
    <path d="M5.5 5.5 L10.5 10.5 M10.5 5.5 L5.5 10.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Warning: orange triangle with white exclamation -->
  <symbol id="icon-warning" viewBox="0 0 16 16">
    <path d="M8 1 L15 14 Q15 15 14 15 L2 15 Q1 15 1 14 Z" fill="#ff9201"/>
    <rect x="7.25" y="5.5" width="1.5" height="5" rx="0.75" fill="#fff"/>
    <circle cx="8" cy="12.5" r="1" fill="#fff"/>
  </symbol>

  <!-- Queue: grey rounded square with stacked squares icon -->
  <symbol id="icon-queue" viewBox="0 0 16 16">
    <rect x="0.5" y="0.5" width="15" height="15" rx="3" fill="#666"/>
    <rect x="4" y="4" width="4" height="4" fill="none" stroke="#fff" stroke-width="1.25"/>
    <rect x="7" y="7" width="4" height="4" fill="none" stroke="#fff" stroke-width="1.25"/>
  </symbol>

  <!-- Info / Notice: grey rounded square with play arrow -->
  <symbol id="icon-info" viewBox="0 0 16 16">
    <rect x="0.5" y="0.5" width="15" height="15" rx="3" fill="#666"/>
    <path d="M6 4.5 L6 11.5 L12 8 Z" fill="#fff"/>
  </symbol>

  <!-- Disabled: grey circle with dash -->
  <symbol id="icon-disabled" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="7.5" fill="#999"/>
    <path d="M4.5 8 L11.5 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </symbol>
</svg>
